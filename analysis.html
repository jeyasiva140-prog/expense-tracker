<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartExpense - Analysis</title>

    <script>
        if (localStorage.getItem("smartExpense_theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>

    <script>
        tailwind = {
            config: {
                darkMode: "class"
            }
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background:
                radial-gradient(circle at top left, rgba(255, 236, 179, 0.7), transparent 35%),
                radial-gradient(circle at bottom right, rgba(191, 219, 254, 0.5), transparent 35%),
                #f8fafc;
            min-height: 100vh;
        }

        .dark body {
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(14, 116, 144, 0.15), transparent 35%),
                #020617;
        }

        .glass {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.78);
            border-color: rgba(148, 163, 184, 0.15);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body class="text-slate-800 dark:text-slate-100">

    <main class="max-w-6xl mx-auto px-4 py-6 sm:px-6 lg:px-8">

        <!-- Header -->
        <header class="flex items-center justify-between mb-8">

            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">
                    Analysis
                </h1>

                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Understand your spending and income
                </p>
            </div>

            <div class="flex items-center gap-2">

                <button
                    id="themeBtn"
                    type="button"
                    onclick="toggleTheme()"
                    class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-center text-lg"
                    aria-label="Switch theme">
                    ☾
                </button>

                <a
                    href="index.html"
                    class="px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-sm font-semibold">
                    Dashboard
                </a>

            </div>

        </header>


        <!-- Statistics -->
        <section
            id="stats"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        </section>


        <!-- Cash Flow Chart -->
        <section class="glass rounded-3xl p-5 sm:p-6 mb-6">

            <div class="mb-5">

                <h2 class="text-xl font-bold">
                    Cash Flow
                </h2>

                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Current month's income, expenses and savings
                </p>

            </div>

            <div class="h-80">
                <canvas id="cash"></canvas>
            </div>

        </section>


        <!-- Category Chart -->
        <section class="glass rounded-3xl p-5 sm:p-6">

            <div class="mb-5">

                <h2 class="text-xl font-bold">
                    Category Spending
                </h2>

                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Current month's expenses by category
                </p>

            </div>

            <div class="h-80">
                <canvas id="bars"></canvas>
            </div>

        </section>

    </main>


    <!-- Shared application logic -->
    <script src="./js/app.js"></script>


    <script>
        let cashChart = null;
        let categoryChart = null;


        document.addEventListener("DOMContentLoaded", function () {

            renderAnalysis();


            window.addEventListener(
                "pageshow",
                renderAnalysis
            );


            window.addEventListener(
                "storage",
                function (event) {

                    if (event.key === STORAGE_KEY) {
                        renderAnalysis();
                    }

                }
            );

        });


        function renderAnalysis() {

            const data = readState();

            const incomeTransactions =
                inc(data);

            const expenseTransactions =
                ex(data);

            const income =
                total(incomeTransactions);

            const expenses =
                total(expenseTransactions);

            const savings =
                income - expenses;


            /* Statistics */

            const stats =
                document.getElementById("stats");


            const savingsClass =
                savings >= 0
                    ? "text-emerald-600 dark:text-emerald-400"
                    : "text-rose-600 dark:text-rose-400";


            stats.innerHTML = `

                <div class="glass rounded-3xl p-5">

                    <div class="text-3xl mb-3">
                        💰
                    </div>

                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        Income
                    </p>

                    <p class="text-2xl font-bold mt-1">
                        ${money(income, data.currency)}
                    </p>

                </div>


                <div class="glass rounded-3xl p-5">

                    <div class="text-3xl mb-3">
                        💸
                    </div>

                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        Expenses
                    </p>

                    <p class="text-2xl font-bold mt-1">
                        ${money(expenses, data.currency)}
                    </p>

                </div>


                <div class="glass rounded-3xl p-5">

                    <div class="text-3xl mb-3">
                        💎
                    </div>

                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        Savings
                    </p>

                    <p class="text-2xl font-bold mt-1 ${savingsClass}">
                        ${money(savings, data.currency)}
                    </p>

                </div>


                <div class="glass rounded-3xl p-5">

                    <div class="text-3xl mb-3">
                        📊
                    </div>

                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        Transactions
                    </p>

                    <p class="text-2xl font-bold mt-1">
                        ${incomeTransactions.length + expenseTransactions.length}
                    </p>

                </div>

            `;


            renderCashChart(
                income,
                expenses,
                savings,
                data
            );


            renderCategoryChart(
                expenseTransactions,
                data
            );

        }


        function renderCashChart(
            income,
            expenses,
            savings,
            data
        ) {

            const canvas =
                document.getElementById("cash");


            if (!canvas || typeof Chart === "undefined") {
                return;
            }


            if (cashChart) {
                cashChart.destroy();
            }


            cashChart = new Chart(
                canvas,
                {
                    type: "bar",

                    data: {
                        labels: [
                            "Income",
                            "Expenses",
                            "Savings"
                        ],

                        datasets: [
                            {
                                label: "Amount",

                                data: [
                                    income,
                                    expenses,
                                    savings
                                ],

                                borderWidth: 1,

                                borderRadius: 8
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                display: false
                            },

                            tooltip: {
                                callbacks: {
                                    label: function (context) {

                                        return money(
                                            context.raw,
                                            data.currency
                                        );

                                    }
                                }
                            }
                        },

                        scales: {

                            y: {
                                beginAtZero: true,

                                ticks: {
                                    callback: function (value) {

                                        return money(
                                            value,
                                            data.currency
                                        );

                                    }
                                }
                            }

                        }

                    }

                }
            );

        }


        function renderCategoryChart(
            transactions,
            data
        ) {

            const canvas =
                document.getElementById("bars");


            if (!canvas || typeof Chart === "undefined") {
                return;
            }


            if (categoryChart) {
                categoryChart.destroy();
            }


            const categoryTotals = {};


            transactions.forEach(function (transaction) {

                const category =
                    transaction.category || "Others";

                categoryTotals[category] =
                    (categoryTotals[category] || 0) +
                    Number(transaction.amount || 0);

            });


            const labels =
                Object.keys(categoryTotals);


            const values =
                Object.values(categoryTotals);


            categoryChart = new Chart(
                canvas,
                {
                    type: "bar",

                    data: {
                        labels: labels,

                        datasets: [
                            {
                                label: "Spending",

                                data: values,

                                borderWidth: 1,

                                borderRadius: 8
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                display: false
                            },

                            tooltip: {
                                callbacks: {
                                    label: function (context) {

                                        return money(
                                            context.raw,
                                            data.currency
                                        );

                                    }
                                }
                            }
                        },

                        scales: {

                            y: {
                                beginAtZero: true,

                                ticks: {
                                    callback: function (value) {

                                        return money(
                                            value,
                                            data.currency
                                        );

                                    }
                                }
                            }

                        }

                    }

                }
            );

        }

    </script>

</body>
</html>
