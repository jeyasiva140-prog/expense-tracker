<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>See Analysis — SmartExpense</title><script>try{if(localStorage.getItem("smartExpense_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/shared.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
*{box-sizing:border-box}body{min-height:100vh;background:#f6f8fb;color:#0f172a;transition:.25s}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid rgba(226,232,240,.9)}
.card-3d{transition:transform .25s,box-shadow .25s}.card-3d:hover{transform:perspective(900px) rotateX(2deg) rotateY(-2deg) translateY(-3px);box-shadow:0 20px 45px rgba(15,23,42,.1)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.float{animation:float 5s ease-in-out infinite}
html.dark,html.dark body{background:#070b14!important;color:#e5e7eb!important}html.dark .glass{background:rgba(15,23,42,.96)!important;border-color:#263449!important;color:#e5e7eb!important}
html.dark .bg-white,html.dark .bg-slate-50{background:#0f172a!important}html.dark .bg-slate-100{background:#1e293b!important}html.dark .text-slate-800,html.dark .text-slate-900{color:#f1f5f9!important}html.dark .text-slate-500{color:#94a3b8!important}html.dark input,html.dark select,html.dark textarea{background:#111827!important;color:#f8fafc!important;border-color:#334155!important}html.dark .border-slate-200{border-color:#334155!important}
@media(min-width:1600px){body{font-size:18px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="max-w-[1900px] mx-auto min-h-screen px-4 sm:px-6 lg:px-10 py-5"><header class="flex items-center justify-between mb-7"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><p class="text-xs text-slate-500">Dedicated analytics</p></div><div class="flex gap-2"><button id="themeBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white border border-slate-200">☼</button><a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Dashboard</a></div></header><section><div class="mb-5"><h1 class="text-3xl font-black">See Analysis</h1><p class="text-sm text-slate-500 mt-1">The charts below use the exact same transaction data shown on the dashboard overview.</p></div><div id="stats" class="grid grid-cols-2 xl:grid-cols-4 gap-3"></div><div class="grid lg:grid-cols-2 gap-5 mt-5"><div class="glass rounded-3xl p-5 card-3d"><h2 class="font-bold mb-4">Income vs Expenses</h2><div class="h-72"><canvas id="cash"></canvas></div></div><div class="glass rounded-3xl p-5 card-3d"><h2 class="font-bold mb-4">Category Spending</h2><div class="h-72"><canvas id="bars"></canvas></div></div></div></section></div><script>
const s=state(),a=ex(s),i=inc(s),g={};a.forEach(t=>g[t.category]=(g[t.category]||0)+Number(t.amount));stats.innerHTML=[["Income",money(total(i),s)],["Expenses",money(total(a),s)],["Savings",money(Math.max(0,total(i)-total(a)),s)],["Transactions",s.transactions.length]].map(x=>`<div class="glass rounded-2xl p-4"><p class="text-xs text-slate-500">${x[0]}</p><p class="text-xl font-black mt-1">${x[1]}</p></div>`).join("");new Chart(cash,{type:"bar",data:{labels:["Income","Expenses","Savings"],datasets:[{data:[total(i),total(a),Math.max(0,total(i)-total(a))],borderRadius:10}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});new Chart(bars,{type:"bar",data:{labels:Object.keys(g),datasets:[{data:Object.values(g),borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
</script></body></html>
