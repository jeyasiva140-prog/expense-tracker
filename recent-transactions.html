<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recent Transactions — SmartExpense</title><script>window.tailwind=window.tailwind||{};window.tailwind.config={darkMode:"class"};</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/theme.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
*{box-sizing:border-box}body{min-height:100vh;background:#f6f8fb;color:#0f172a;transition:.25s}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid #e2e8f0}.card{transition:.25s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(15,23,42,.1)}
html.dark,html.dark body{background:#070b14!important;color:#e5e7eb!important}html.dark .glass{background:#0f172a!important;border-color:#263449!important;color:#e5e7eb!important}html.dark .bg-white,html.dark .bg-slate-50{background:#111827!important}html.dark .bg-slate-100{background:#1e293b!important}html.dark .text-slate-800,html.dark .text-slate-900{color:#f1f5f9!important}html.dark .text-slate-500{color:#94a3b8!important}html.dark input,html.dark select,html.dark textarea{background:#111827!important;color:#f8fafc!important;border-color:#334155!important}html.dark .border-slate-200{border-color:#334155!important}html.dark .divide-slate-100>:not([hidden])~:not([hidden]){border-color:#263449!important}
@media(min-width:1600px){body{font-size:18px}}

html.dark body{background:#070b14!important;color:#e5e7eb!important}
html.dark .bg-white{background-color:#0f172a!important}
html.dark .bg-slate-50{background-color:#0b1220!important}
html.dark .bg-slate-100{background-color:#1e293b!important}
html.dark .text-slate-900,html.dark .text-slate-800,html.dark .text-slate-700{color:#f8fafc!important}
html.dark .text-slate-600{color:#cbd5e1!important}
html.dark .text-slate-500{color:#94a3b8!important}
html.dark .border-slate-200,html.dark .border-slate-300{border-color:#334155!important}
html.dark input,html.dark select,html.dark textarea{background-color:#111827!important;color:#f8fafc!important;border-color:#334155!important}
html.dark input::placeholder,html.dark textarea::placeholder{color:#64748b!important}

html.dark .shadow-sm,html.dark .shadow-lg{--tw-shadow-color:#0008}
#themeBtn{transition:transform .2s ease,background .2s ease,color .2s ease}
#themeBtn:hover{transform:rotate(12deg) scale(1.05)}
</style></head><body><div class="max-w-[1900px] mx-auto min-h-screen px-4 sm:px-6 lg:px-10 py-5"><header class="flex items-center justify-between mb-7"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><p class="text-xs text-slate-500">Dedicated transaction history</p></div><div class="flex gap-2"><button id="themeBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white border border-slate-200">☼</button><a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Dashboard</a></div></header><section class="glass rounded-3xl p-5 sm:p-7"><div class="flex flex-col sm:flex-row justify-between gap-3"><div><h1 class="text-3xl font-black">Recent Transactions</h1><p class="text-sm text-slate-500 mt-1">Search, filter and delete transactions.</p></div><a href="add-expense.html" class="px-4 py-2 h-fit rounded-xl bg-slate-900 text-white font-semibold">+ Add expense</a></div><div class="grid sm:grid-cols-3 gap-3 mt-6"><input id="search" class="rounded-xl border border-slate-200 p-3" placeholder="Search..."><select id="cat" class="rounded-xl border border-slate-200 p-3"></select><select id="type" class="rounded-xl border border-slate-200 p-3"><option value="all">All types</option><option value="expense">Expense</option><option value="income">Income</option></select></div><div id="list" class="mt-5 divide-y divide-slate-100"></div></section></div><script>const CATEGORIES=[["Food","🍔"],["Transport","🚗"],["Shopping","🛍️"],["Bills","🏠"],["Entertainment","🎮"],["Travel","✈️"],["Health","💊"],["Education","📚"],["Others","📦"]];
const KEY="smartExpense_v1";
const DEFAULT_STATE={transactions:[{id:1,type:"income",amount:50000,description:"Monthly salary",category:"Salary",date:"2026-09-01",method:"Bank transfer"},{id:2,type:"expense",amount:850,description:"Groceries",category:"Food",date:"2026-09-02",method:"UPI"},{id:3,type:"expense",amount:420,description:"Fuel",category:"Transport",date:"2026-09-04",method:"Card"},{id:4,type:"expense",amount:1290,description:"Online shopping",category:"Shopping",date:"2026-09-06",method:"UPI"},{id:5,type:"expense",amount:650,description:"Electricity bill",category:"Bills",date:"2026-09-08",method:"Bank transfer"},{id:6,type:"expense",amount:320,description:"Lunch",category:"Food",date:"2026-09-10",method:"UPI"},{id:7,type:"expense",amount:550,description:"Movie & snacks",category:"Entertainment",date:"2026-09-12",method:"Card"}],budgets:{Food:5000,Transport:4000,Shopping:4000,Bills:8000,Entertainment:2500,Travel:6000,Health:3000,Education:3000,Others:2500},goals:[{id:1,name:"Emergency Fund",target:50000,current:19000,date:"2027-03-01"}],currency:"₹"};
function state(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(DEFAULT_STATE)}catch(e){return structuredClone(DEFAULT_STATE)}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function today(){return new Date().toISOString().slice(0,10)}
function month(s){return s.transactions.filter(t=>t.date?.slice(0,7)===today().slice(0,7))}
function ex(s){return month(s).filter(t=>t.type==="expense")}
function inc(s){return month(s).filter(t=>t.type==="income")}
function total(a){return a.reduce((n,t)=>n+Number(t.amount||0),0)}
function money(n,s){return `${s.currency}${Math.round(n).toLocaleString("en-IN")}`}
function icon(c){return (CATEGORIES.find(x=>x[0]===c)||["","•"])[1]}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toggleTheme(){const dark=!document.documentElement.classList.contains("dark");document.documentElement.classList.toggle("dark",dark);localStorage.setItem("smartExpense_theme",dark?"dark":"light");const b=document.getElementById("themeBtn");if(b)b.textContent=dark?"☾":"☼"}
(function(){if(localStorage.getItem("smartExpense_theme")==="dark")document.documentElement.classList.add("dark")})();
let s=state();cat.innerHTML='<option value="all">All categories</option>'+CATEGORIES.map(c=>`<option value="${c[0]}">${c[1]} ${c[0]}</option>`).join("");function render(){s=state();const q=search.value.toLowerCase(),a=s.transactions.filter(t=>(type.value==="all"||t.type===type.value)&&(cat.value==="all"||t.category===cat.value)&&(`${t.description} ${t.category}`.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);list.innerHTML=a.length?a.map(t=>`<div class="py-4 flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-slate-100 grid place-items-center">${t.type==="income"?"💰":icon(t.category)}</div><div class="flex-1 min-w-0"><p class="font-bold truncate">${esc(t.description)}</p><p class="text-xs text-slate-500">${esc(t.category)} · ${t.date} · ${esc(t.method)}</p></div><b class="${t.type==="income"?"text-emerald-600":""}">${t.type==="income"?"+":"-"}${money(t.amount,s)}</b><button onclick="del(${t.id})" class="text-xs text-rose-500 ml-2">Delete</button></div>`).join(""):'<p class="py-10 text-center text-slate-500">No transactions found.</p>'}function del(id){s.transactions=s.transactions.filter(t=>t.id!==id);save(s);render()}[search,cat,type].forEach(x=>x.oninput=render);window.addEventListener("pageshow",render);window.addEventListener("storage",render);render();</script></body></html>
