<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recent Transactions — SmartExpense</title><script>try{if(localStorage.getItem("smartExpense_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/shared.js"></script><style>
*{box-sizing:border-box}body{min-height:100vh;background:#f6f8fb;color:#0f172a;transition:.25s}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid rgba(226,232,240,.9)}
.card-3d{transition:transform .25s,box-shadow .25s}.card-3d:hover{transform:perspective(900px) rotateX(2deg) rotateY(-2deg) translateY(-3px);box-shadow:0 20px 45px rgba(15,23,42,.1)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.float{animation:float 5s ease-in-out infinite}
html.dark,html.dark body{background:#070b14!important;color:#e5e7eb!important}html.dark .glass{background:rgba(15,23,42,.96)!important;border-color:#263449!important;color:#e5e7eb!important}
html.dark .bg-white,html.dark .bg-slate-50{background:#0f172a!important}html.dark .bg-slate-100{background:#1e293b!important}html.dark .text-slate-800,html.dark .text-slate-900{color:#f1f5f9!important}html.dark .text-slate-500{color:#94a3b8!important}html.dark input,html.dark select,html.dark textarea{background:#111827!important;color:#f8fafc!important;border-color:#334155!important}html.dark .border-slate-200{border-color:#334155!important}
@media(min-width:1600px){body{font-size:18px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="max-w-[1900px] mx-auto min-h-screen px-4 sm:px-6 lg:px-10 py-5"><header class="flex items-center justify-between mb-7"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><p class="text-xs text-slate-500">Dedicated transaction history</p></div><div class="flex gap-2"><button id="themeBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white border border-slate-200">☼</button><a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Dashboard</a></div></header><section class="glass rounded-3xl p-5 sm:p-7"><div class="flex flex-col sm:flex-row justify-between gap-3"><div><h1 class="text-3xl font-black">Recent Transactions</h1><p class="text-sm text-slate-500 mt-1">Every transaction saved from Add Transaction is shown here and is shared with the dashboard.</p></div><a href="add-expense.html" class="px-4 py-2 h-fit rounded-xl bg-slate-900 text-white font-semibold">+ Add Transaction</a></div><div class="grid sm:grid-cols-3 gap-3 mt-6"><input id="search" class="rounded-xl border border-slate-200 p-3" placeholder="Search..."><select id="cat" class="rounded-xl border border-slate-200 p-3"></select><select id="type" class="rounded-xl border border-slate-200 p-3"><option value="all">All types</option><option value="expense">Expense</option><option value="income">Income</option></select></div><div id="list" class="mt-5 divide-y divide-slate-100"></div></section></div><script>
let s=state();cat.innerHTML='<option value="all">All categories</option>'+CATEGORIES.map(c=>`<option value="${c[0]}">${c[1]} ${c[0]}</option>`).join("");function render(){s=state();const q=search.value.toLowerCase();const a=s.transactions.filter(t=>(type.value==="all"||t.type===type.value)&&(cat.value==="all"||t.category===cat.value)&&(`${t.description} ${t.category} ${t.method}`.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);list.innerHTML=a.length?a.map(t=>`<div class="py-4 flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-slate-100 grid place-items-center">${t.type==="income"?"💰":icon(t.category)}</div><div class="flex-1 min-w-0"><p class="font-bold truncate">${esc(t.description)}</p><p class="text-xs text-slate-500">${esc(t.category)} · ${t.date} · ${esc(t.method)}</p></div><b class="${t.type==="income"?"text-emerald-600":"text-rose-600"}">${t.type==="income"?"+":"-"}${money(t.amount,s)}</b><button onclick="del(${t.id})" class="text-xs text-rose-500 ml-2">Delete</button></div>`).join(""):'<p class="py-10 text-center text-slate-500">No transactions found.</p>'}function del(id){deleteSharedTransaction(id);render()}[search,cat,type].forEach(x=>x.oninput=render);render();
</script></body></html>
