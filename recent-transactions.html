            /* Render transactions */
            function render() {

                const data = readState();

                const search =
                    searchInput.value
                        .trim()
                        .toLowerCase();

                const selectedCategory =
                    categorySelect.value;

                const selectedType =
                    typeSelect.value;


                let transactions =
                    Array.isArray(data.transactions)
                        ? [...data.transactions]
                        : [];


                transactions = transactions
                    .filter(function (transaction) {

                        const matchesSearch =
                            !search ||
                            String(transaction.description || "")
                                .toLowerCase()
                                .includes(search) ||
                            String(transaction.category || "")
                                .toLowerCase()
                                .includes(search) ||
                            String(transaction.method || "")
                                .toLowerCase()
                                .includes(search);

                        const matchesCategory =
                            selectedCategory === "all" ||
                            transaction.category === selectedCategory;

                        const matchesType =
                            selectedType === "all" ||
                            transaction.type === selectedType;

                        return (
                            matchesSearch &&
                            matchesCategory &&
                            matchesType
                        );

                    })
                    .sort(function (a, b) {

                        const dateCompare =
                            String(b.date || "")
                                .localeCompare(
                                    String(a.date || "")
                                );

                        if (dateCompare !== 0) {
                            return dateCompare;
                        }

                        return Number(b.id || 0) -
                               Number(a.id || 0);

                    });
