<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartExpense - Income</title>

    <script>
        if (localStorage.getItem("smartExpense_theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>

    <script>
        tailwind = {
            config: {
                darkMode: "class"
            }
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/theme.js"></script>

    <style>
        body {
            background:
                radial-gradient(circle at top left, rgba(255, 236, 179, 0.7), transparent 35%),
                radial-gradient(circle at bottom right, rgba(191, 219, 254, 0.5), transparent 35%),
                #f8fafc;
            min-height: 100vh;
        }

        .dark body {
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(14, 116, 144, 0.15), transparent 35%),
                #020617;
        }

        .glass {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.78);
            border-color: rgba(148, 163, 184, 0.15);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body class="text-slate-800 dark:text-slate-100">

    <main class="max-w-6xl mx-auto px-4 py-6 sm:px-6 lg:px-8">

        <!-- Header -->
        <header class="flex items-center justify-between mb-8">

            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">
                    Income
                </h1>

                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Track your income for this month
                </p>
            </div>

            <div class="flex items-center gap-2">

                <button
                    id="themeBtn"
                    type="button"
                    onclick="toggleTheme()"
                    class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-center text-lg"
                    aria-label="Switch theme">
                    ☾
                </button>

                <a
                    href="index.html"
                    class="px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-sm font-semibold">
                    Dashboard
                </a>

            </div>

        </header>


        <!-- Income Cards -->
        <section
            id="incomeGrid"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        </section>

    </main>


    <!-- Shared application logic -->
    <script src="./js/app.js"></script>


    <script>
        document.addEventListener("DOMContentLoaded", function () {

            renderIncome();


            window.addEventListener(
                "pageshow",
                renderIncome
            );


            window.addEventListener(
                "storage",
                function (event) {

                    if (event.key === STORAGE_KEY) {
                        renderIncome();
                    }

                }
            );

        });


        function renderIncome() {

            const data = readState();

            const incomeGrid =
                document.getElementById("incomeGrid");


            const transactions =
                inc(data);


            const incomeGroups = {};


            transactions.forEach(function (transaction) {

                const category =
                    transaction.category || "Income";


                incomeGroups[category] =
                    (incomeGroups[category] || 0) +
                    Number(transaction.amount || 0);

            });


            const groups =
                Object.entries(incomeGroups);


            if (!groups.length) {

                incomeGrid.innerHTML = `
                    <div class="glass rounded-3xl p-8 text-center col-span-full">

                        <div class="text-5xl mb-4">
                            💰
                        </div>

                        <h2 class="text-xl font-bold">
                            No income transactions yet
                        </h2>

                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">
                            Your current month's income will appear here.
                        </p>

                    </div>
                `;

                return;
            }


            incomeGrid.innerHTML =
                groups.map(function ([category, amount]) {

                    return `
                        <div class="glass rounded-3xl p-6">

                            <div class="flex items-center justify-between">

                                <div>

                                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 flex items-center justify-center text-2xl mb-4">
                                        💰
                                    </div>

                                    <h2 class="text-lg font-bold">
                                        ${esc(category)}
                                    </h2>

                                </div>

                            </div>


                            <p class="text-3xl font-bold text-emerald-600 dark:text-emerald-400 mt-4">
                                ${money(amount, data.currency)}
                            </p>


                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">
                                Income this month
                            </p>

                        </div>
                    `;

                }).join("");

        }

    </script>

</body>
</html>
