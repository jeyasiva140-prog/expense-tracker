<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Income — SmartExpense</title><script>try{if(localStorage.getItem("smartExpense_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/shared.js"></script><style>body{background:#f6f8fb;color:#0f172a}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid #e2e8f0}html.dark,html.dark body{background:#070b14!important;color:#e5e7eb!important}html.dark .glass{background:#0f172a!important;border-color:#263449!important}html.dark .bg-white{background:#0f172a!important}</style></head><body><div class="max-w-[1900px] mx-auto min-h-screen px-4 sm:px-6 lg:px-10 py-5"><header class="flex items-center justify-between mb-7"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><p class="text-xs text-slate-500">Income overview</p></div><div class="flex gap-2"><button id="themeBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white border border-slate-200">☼</button><a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Dashboard</a></div></header><h1 class="text-3xl font-black">Income</h1><p class="text-sm text-slate-500 mt-1">Income from the same shared transaction store.</p><div id="cards" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-6"></div></div><script>const s=state(),groups={};inc(s).forEach(t=>groups[t.category]=(groups[t.category]||0)+Number(t.amount));cards.innerHTML=Object.keys(groups).length?Object.entries(groups).map(([k,v])=>`<div class="glass rounded-3xl p-5"><div class="w-11 h-11 rounded-2xl bg-emerald-50 grid place-items-center">💰</div><p class="text-sm text-slate-500 mt-4">${esc(k)}</p><p class="text-2xl font-black mt-1">${money(v,s)}</p></div>`).join(""):`<div class="glass rounded-3xl p-6 text-slate-500">No income recorded this month.</div>`;</script></body></html>
