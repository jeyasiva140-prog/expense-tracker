<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SmartExpense — Savings Goals</title><script>if(localStorage.getItem('smartExpense_theme')==='dark')document.documentElement.classList.add('dark');</script><script>tailwind={config:{darkMode:'class'}};</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/theme.js"></script><style>body{background:#f6f8fb}html.dark body{background:#070b14;color:#e5e7eb}html.dark .bg-white{background:#0f172a!important}.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8)}html.dark .glass{background:rgba(15,23,42,.94);border-color:#263449}</style></head><body class="min-h-screen"><main class="max-w-6xl mx-auto p-5 sm:p-8"><header class="flex items-center justify-between mb-8"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><h1 class="text-3xl font-black mt-5">Savings Goals</h1><p class="text-slate-500 mt-1">Give your savings a destination.</p></div><button id="themeBtn" onclick="toggleTheme()" class="w-11 h-11 rounded-xl bg-white border border-slate-200">☼</button></header><div id="goalGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></main><script src="./js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const s=JSON.parse(localStorage.getItem('smartExpense_v1')||'{}'),g=s.goals||[];document.getElementById('goalGrid').innerHTML=g.map(x=>{const p=Math.min(100,Math.round(Number(x.current||0)/Number(x.target||1)*100));return `<div class="glass rounded-3xl p-6"><div class="text-3xl">🎯</div><h2 class="font-bold text-lg mt-3">${x.name}</h2><p class="text-2xl font-black mt-2">₹${Math.round(x.current||0).toLocaleString('en-IN')} <span class="text-sm font-normal text-slate-500">/ ₹${Math.round(x.target||0).toLocaleString('en-IN')}</span></p><div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 mt-4"><div class="h-full bg-indigo-500 rounded-full" style="width:${p}%"></div></div><p class="text-sm text-slate-500 mt-2">${p}% complete</p></div>`}).join('')||'<div class="glass rounded-3xl p-6 text-slate-500">No savings goals yet.</div>';});</script></body></html>
