<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Goals — SmartExpense</title><script>try{if(localStorage.getItem("smartExpense_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/shared.js"></script><style>body{background:#f6f8fb;color:#0f172a}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid #e2e8f0}html.dark,html.dark body{background:#070b14!important;color:#e5e7eb!important}html.dark .glass{background:#0f172a!important;border-color:#263449!important}</style></head><body><div class="max-w-[1900px] mx-auto min-h-screen px-4 sm:px-6 lg:px-10 py-5"><header class="flex items-center justify-between mb-7"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><p class="text-xs text-slate-500">Savings goals</p></div><div class="flex gap-2"><button id="themeBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white border border-slate-200">☼</button><a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Dashboard</a></div></header><div class="flex justify-between items-center"><div><h1 class="text-3xl font-black">Savings Goals</h1><p class="text-sm text-slate-500 mt-1">Track progress toward your goals.</p></div><button onclick="newGoal()" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">New goal</button></div><div id="grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-6"></div></div><script>function render(){const s=state();grid.innerHTML=s.goals.length?s.goals.map(g=>{const p=Math.min(100,g.target?g.current/g.target*100:0);return `<div class="glass rounded-3xl p-5"><div class="flex justify-between"><span class="text-2xl">🎯</span><span class="text-xs font-bold">${Math.round(p)}%</span></div><h3 class="font-bold mt-4">${esc(g.name)}</h3><p class="text-sm text-slate-500 mt-1">${money(g.current,s)} of ${money(g.target,s)}</p><div class="h-3 bg-slate-100 rounded-full mt-5 overflow-hidden"><div class="h-full bg-slate-900 rounded-full" style="width:${p}%"></div></div><button onclick="addMoney(${g.id})" class="mt-4 text-sm font-bold">Add savings +</button></div>`}).join(""):`<div class="glass rounded-3xl p-6 text-slate-500">Create your first savings goal.</div>`}function newGoal(){const s=state(),name=prompt("Goal name:","New Goal"),target=Number(prompt("Target amount:","50000"));if(name&&target>0){s.goals.push({id:Date.now(),name,target,current:0,date:""});save(s);render()}}function addMoney(id){const s=state(),g=s.goals.find(x=>x.id===id),v=Number(prompt("Amount to add:","1000"));if(g&&v>0){g.current+=v;save(s);render()}}render();</script></body></html>
