<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartExpense - Add Expense</title>

    <script>
        if (localStorage.getItem("smartExpense_theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>

    <script>
        tailwind = {
            config: {
                darkMode: "class"
            }
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/theme.js"></script>

    <style>
        body {
             background: radial-gradient(
                circle,
                rgba(238, 174, 202, 1) 0%,
                rgba(148, 187, 233, 1) 100%
            );
            min-height: 100vh;
        }

        .dark body {
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(14, 116, 144, 0.15), transparent 35%),
                #020617;
        }

        .glass {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.78);
            border-color: rgba(148, 163, 184, 0.15);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }

        input,
        select,
        textarea {
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }
    </style>
</head>

<body class="text-slate-800 dark:text-slate-100">

    <main class="max-w-5xl mx-auto px-4 py-6 sm:px-6 lg:px-8">

        <!-- Header -->
        <header class="flex items-center justify-between mb-8">

            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">
                    Add Expense
                </h1>

                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Record your daily spending
                </p>
            </div>

            <div class="flex items-center gap-2">

                <button
                    id="themeBtn"
                    type="button"
                    onclick="toggleTheme()"
                    class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-center text-lg"
                    aria-label="Switch theme">
                    ☾
                </button>

                <a
                    href="index.html"
                    class="px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-sm font-semibold">
                    Dashboard
                </a>

            </div>

        </header>


        <!-- Main Card -->
        <section class="glass rounded-3xl p-5 sm:p-8">

            <div class="mb-7">
                <h2 class="text-xl sm:text-2xl font-bold">
                    Expense Details
                </h2>

                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Enter the details of your expense below.
                </p>
            </div>


            <form id="form" class="space-y-5">

                <!-- Amount -->
                <div>
                    <label
                        for="amount"
                        class="block text-sm font-semibold mb-2">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        min="0"
                        step="0.01"
                        placeholder="Enter amount"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-white">
                </div>


                <!-- Date -->
                <div>
                    <label
                        for="date"
                        class="block text-sm font-semibold mb-2">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-white">
                </div>


                <!-- Description -->
                <div>
                    <label
                        for="description"
                        class="block text-sm font-semibold mb-2">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Example: Grocery shopping"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-white">
                </div>


                <!-- Category -->
                <div>
                    <label
                        for="category"
                        class="block text-sm font-semibold mb-2">
                        Category
                    </label>

                    <select
                        id="category"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-white">
                    </select>
                </div>


                <!-- Payment Method -->
                <div>
                    <label
                        for="method"
                        class="block text-sm font-semibold mb-2">
                        Payment Method
                    </label>

                    <select
                        id="method"
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-white">

                        <option value="">Select payment method</option>
                        <option value="UPI">UPI</option>
                        <option value="Cash">Cash</option>
                        <option value="Card">Card</option>
                        <option value="Bank transfer">Bank transfer</option>

                    </select>
                </div>


                <!-- Notes -->
                <div>
                    <label
                        for="notes"
                        class="block text-sm font-semibold mb-2">
                        Notes
                    </label>

                    <textarea
                        id="notes"
                        rows="4"
                        placeholder="Optional notes"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-white resize-none"></textarea>
                </div>


                <!-- Monthly Summary -->
                <div
                    id="summary"
                    class="rounded-2xl p-5 bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900">

                    <div class="flex items-center justify-between gap-4">

                        <div>
                            <p class="text-sm text-slate-500 dark:text-slate-400">
                                This month's expenses
                            </p>

                            <p
                                id="monthlyExpense"
                                class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 mt-1">
                                ₹0
                            </p>
                        </div>

                        <div class="text-3xl">
                            💸
                        </div>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 pt-2">

                    <button
                        type="reset"
                        id="expenseReset"
                        class="w-full sm:w-auto px-6 py-3 rounded-xl border border-slate-300 dark:border-slate-700 font-semibold bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800">
                        Reset
                    </button>

                    <button
                        type="submit"
                        class="w-full sm:flex-1 px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold">
                        Add Expense
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- Shared application logic -->
    <script src="./js/app.js"></script>


    <!-- Page logic -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const form = document.getElementById("form");
            const amountInput = document.getElementById("amount");
            const dateInput = document.getElementById("date");
            const descriptionInput = document.getElementById("description");
            const categoryInput = document.getElementById("category");
            const methodInput = document.getElementById("method");
            const notesInput = document.getElementById("notes");
            const monthlyExpense = document.getElementById("monthlyExpense");
            const resetButton = document.getElementById("expenseReset");


            /* Set today's date */
            dateInput.value = today();


            /* Load categories */
            categoryInput.innerHTML =
                '<option value="">Select category</option>' +
                CATEGORIES.map(function (item) {
                    return `
                        <option value="${item[0]}">
                            ${item[1]} ${item[0]}
                        </option>
                    `;
                }).join("");


            /* Update monthly expense */
            function updateMonthlySummary() {

                const data = readState();

                const currentMonthExpenses = ex(data);

                const amount = total(currentMonthExpenses);

                monthlyExpense.textContent = money(
                    amount,
                    data.currency
                );
            }


            updateMonthlySummary();


            /* Add expense */
            form.addEventListener("submit", function (event) {

                event.preventDefault();


                const amount = Number(amountInput.value);

                const date = dateInput.value;

                const description =
                    descriptionInput.value.trim();

                const category =
                    categoryInput.value;

                const method =
                    methodInput.value;

                const notes =
                    notesInput.value.trim();


                if (!amount || amount <= 0) {

                    alert("Please enter a valid amount.");

                    amountInput.focus();

                    return;
                }


                if (!date) {

                    alert("Please select a date.");

                    dateInput.focus();

                    return;
                }


                if (!description) {

                    alert("Please enter a description.");

                    descriptionInput.focus();

                    return;
                }


                if (!category) {

                    alert("Please select a category.");

                    categoryInput.focus();

                    return;
                }


                if (!method) {

                    alert("Please select a payment method.");

                    methodInput.focus();

                    return;
                }


                addSharedTransaction({
                    type: "expense",
                    amount: amount,
                    description: description,
                    category: category,
                    date: date,
                    method: method,
                    notes: notes
                });


                alert("Expense added successfully!");


                window.location.href =
                    "recent-transactions.html";
            });


            /* Reset form */
            resetButton.addEventListener("click", function () {

                setTimeout(function () {

                    dateInput.value = today();

                    updateMonthlySummary();

                }, 0);

            });


            /* Update summary if data changes in another tab */
            window.addEventListener("storage", function (event) {

                if (event.key === STORAGE_KEY) {

                    updateMonthlySummary();

                }

            });

        });
    </script>

</body>
</html>
