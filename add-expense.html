<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Transaction — SmartExpense</title><script>try{if(localStorage.getItem("smartExpense_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/shared.js"></script><style>
*{box-sizing:border-box}body{min-height:100vh;background:#f6f8fb;color:#0f172a;transition:.25s}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid rgba(226,232,240,.9)}
.card-3d{transition:transform .25s,box-shadow .25s}.card-3d:hover{transform:perspective(900px) rotateX(2deg) rotateY(-2deg) translateY(-3px);box-shadow:0 20px 45px rgba(15,23,42,.1)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.float{animation:float 5s ease-in-out infinite}
html.dark,html.dark body{background:#070b14!important;color:#e5e7eb!important}html.dark .glass{background:rgba(15,23,42,.96)!important;border-color:#263449!important;color:#e5e7eb!important}
html.dark .bg-white,html.dark .bg-slate-50{background:#0f172a!important}html.dark .bg-slate-100{background:#1e293b!important}html.dark .text-slate-800,html.dark .text-slate-900{color:#f1f5f9!important}html.dark .text-slate-500{color:#94a3b8!important}html.dark input,html.dark select,html.dark textarea{background:#111827!important;color:#f8fafc!important;border-color:#334155!important}html.dark .border-slate-200{border-color:#334155!important}
@media(min-width:1600px){body{font-size:18px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="max-w-[1900px] mx-auto min-h-screen px-4 sm:px-6 lg:px-10 py-5"><header class="flex items-center justify-between mb-7"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><p class="text-xs text-slate-500">Dedicated transaction entry</p></div><div class="flex gap-2"><button id="themeBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white border border-slate-200">☼</button><a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Dashboard</a></div></header><div class="grid lg:grid-cols-3 gap-5"><section class="lg:col-span-2 glass rounded-3xl p-5 sm:p-8 card-3d"><h1 class="text-3xl font-black">Add Transaction</h1><p class="text-sm text-slate-500 mt-1">Save a transaction once and it will immediately appear in the dashboard overview, recent transactions and analysis.</p><form id="form" class="mt-7 space-y-4"><div class="grid sm:grid-cols-2 gap-4"><label class="text-sm font-bold">Amount<input id="amount" type="number" min="1" step=".01" required class="mt-1 w-full rounded-xl border border-slate-200 p-3" placeholder="0"></label><label class="text-sm font-bold">Date<input id="date" type="date" required class="mt-1 w-full rounded-xl border border-slate-200 p-3"></label></div><label class="text-sm font-bold block">Transaction name<input id="description" required class="mt-1 w-full rounded-xl border border-slate-200 p-3" placeholder="e.g. Dinner"></label><div class="grid sm:grid-cols-2 gap-4"><label class="text-sm font-bold">Type<select id="txType" class="mt-1 w-full rounded-xl border border-slate-200 p-3"><option value="expense">Expense</option><option value="income">Income</option></select></label><label class="text-sm font-bold">Category<select id="category" class="mt-1 w-full rounded-xl border border-slate-200 p-3"></select></label></div><label class="text-sm font-bold block">Payment method<select id="method" class="mt-1 w-full rounded-xl border border-slate-200 p-3"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank transfer</option></select></label><label class="text-sm font-bold block">Notes<textarea id="notes" rows="3" class="mt-1 w-full rounded-xl border border-slate-200 p-3" placeholder="Optional"></textarea></label><button class="w-full py-3 rounded-xl bg-slate-900 text-white font-bold hover:-translate-y-0.5 transition">Save Transaction</button></form></section><aside class="glass rounded-3xl p-6 h-fit"><p class="text-xs font-bold text-indigo-600">THIS MONTH</p><p id="summary" class="text-3xl font-black mt-2"></p><p class="text-sm text-slate-500">Total expenses</p><div class="mt-6 p-4 rounded-2xl bg-slate-50"><p class="text-xs text-slate-500">After saving</p><p class="font-semibold text-sm mt-1">Your dashboard overview refreshes from the same LocalStorage data.</p></div></aside></div></div><script>
const s=state();date.value=today();category.innerHTML=CATEGORIES.map(c=>`<option value="${c[0]}">${c[1]} ${c[0]}</option>`).join("");summary.textContent=money(total(ex(s)),s);form.onsubmit=e=>{e.preventDefault();addSharedTransaction({type:txType.value,amount:amount.value,description:description.value,category:txType.value==="income"?"Salary":category.value,date:date.value,method:method.value,notes:notes.value});location.href="index.html"};
</script></body></html>
