<!-- Page logic -->

  <script>

   document.addEventListener("DOMContentLoaded", function () {


            const form = document.getElementById("form");

            const amountInput = document.getElementById("amount");

            const dateInput = document.getElementById("date");

            const descriptionInput = document.getElementById("description");

            const categoryInput = document.getElementById("category");

            const methodInput = document.getElementById("method");

            const notesInput = document.getElementById("notes");

            const monthlyExpense = document.getElementById("monthlyExpense");

            const resetButton = document.getElementById("expenseReset");



            /* Set today's date */

            dateInput.value = today();



            /* Load categories */

            categoryInput.innerHTML =

                '<option value="">Select category</option>' +

                CATEGORIES.map(function (item) {

                    return `

                        <option value="${item[0]}">

                            ${item[1]} ${item[0]}

                        </option>

                    `;

                }).join("");



            /* Update monthly expense */

            function updateMonthlySummary() {


                const data = readState();


                const currentMonthExpenses = ex(data);


                const amount = total(currentMonthExpenses);


                monthlyExpense.textContent = money(

                    amount,

                    data.currency

                );

            }



            updateMonthlySummary();



            /* Add expense */

            form.addEventListener("submit", function (event) {


                event.preventDefault();



                const amount = Number(amountInput.value);


                const date = dateInput.value;


                const description =

                    descriptionInput.value.trim();


                const category =

                    categoryInput.value;


                const method =

                    methodInput.value;


                const notes =

                    notesInput.value.trim();



                if (!amount || amount <= 0) {


                    alert("Please enter a valid amount.");


                    amountInput.focus();


                    return;

                }



                if (!date) {


                    alert("Please select a date.");


                    dateInput.focus();

                    return;
                }


                if (!description) {

                    alert("Please enter a description.");

                    descriptionInput.focus();

                    return;
                }


                if (!category) {

                    alert("Please select a category.");

                    categoryInput.focus();

                    return;
                }


                if (!method) {

                    alert("Please select a payment method.");

                    methodInput.focus();

                    return;
                }


                addSharedTransaction({
                    type: "expense",
                    amount: amount,
                    description: description,
                    category: category,
                    date: date,
                    method: method,
                    notes: notes
                });


                alert("Expense added successfully!");


                window.location.href =
                    "recent-transactions.html";
            });


            /* Reset form */
            resetButton.addEventListener("click", function () {

                setTimeout(function () {

                    dateInput.value = today();

                    updateMonthlySummary();

                }, 0);

            });


            /* Update summary if data changes in another tab */
            window.addEventListener("storage", function (event) {

                if (event.key === STORAGE_KEY) {

                    updateMonthlySummary();

                }

            });

        });
  </script>
