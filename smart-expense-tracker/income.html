<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SmartExpense — Income</title><script>if(localStorage.getItem('smartExpense_theme')==='dark')document.documentElement.classList.add('dark');</script><script>tailwind={config:{darkMode:'class'}};</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/theme.js"></script><style>body{background:#f6f8fb}html.dark body{background:#070b14;color:#e5e7eb}html.dark .bg-white{background:#0f172a!important}html.dark .bg-slate-50{background:#111827!important}html.dark .text-slate-800,html.dark .text-slate-900{color:#f8fafc!important}html.dark .border-slate-200{border-color:#334155!important}.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8)}html.dark .glass{background:rgba(15,23,42,.94);border-color:#263449}</style></head><body class="text-slate-800 min-h-screen"><main class="max-w-6xl mx-auto p-5 sm:p-8"><header class="flex items-center justify-between mb-8"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><h1 class="text-3xl font-black mt-5">Income</h1><p class="text-slate-500 mt-1">See where your incoming money comes from.</p></div><button id="themeBtn" onclick="toggleTheme()" class="w-11 h-11 rounded-xl bg-white border border-slate-200">☼</button></header><div id="incomeGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></main><script src="./js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const s=JSON.parse(localStorage.getItem('smartExpense_v1')||'{}');const tx=(s.transactions||[]).filter(t=>t.type==='income');const g={};tx.forEach(t=>g[t.category||'Income']=(g[t.category||'Income']||0)+Number(t.amount||0));document.getElementById('incomeGrid').innerHTML=Object.entries(g).map(([k,v])=>`<div class="glass rounded-3xl p-6"><div class="text-3xl">💰</div><h2 class="font-bold text-lg mt-3">${k}</h2><p class="text-3xl font-black mt-2">${s.currency||'₹'}${Math.round(v).toLocaleString('en-IN')}</p></div>`).join('')||'<div class="glass rounded-3xl p-6 text-slate-500">No income transactions yet.</div>';});</script></body></html>
