<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Settings — SmartExpense</title><script>try{if(localStorage.getItem("smartExpense_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/shared.js"></script><style>body{background:#f6f8fb;color:#0f172a}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid #e2e8f0}html.dark,html.dark body{background:#070b14!important;color:#e5e7eb!important}html.dark .glass{background:#0f172a!important;border-color:#263449!important}html.dark .bg-white{background:#0f172a!important}</style></head><body><div class="max-w-[1900px] mx-auto min-h-screen px-4 sm:px-6 lg:px-10 py-5"><header class="flex items-center justify-between mb-7"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><p class="text-xs text-slate-500">App settings</p></div><div class="flex gap-2"><button id="themeBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white border border-slate-200">☼</button><a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Dashboard</a></div></header><h1 class="text-3xl font-black">Settings</h1><p class="text-sm text-slate-500 mt-1">Customize your local SmartExpense app.</p><section class="glass rounded-3xl p-5 mt-6 max-w-2xl space-y-5"><label class="block"><span class="text-sm font-semibold">Currency</span><select id="currency" class="mt-2 w-full rounded-xl border border-slate-200 p-3"><option value="₹">₹ INR</option><option value="$">$ USD</option><option value="€">€ EUR</option><option value="£">£ GBP</option></select></label><div class="flex items-center justify-between gap-4 p-4 rounded-2xl bg-slate-50"><div><p class="font-bold">Night mode</p><p class="text-xs text-slate-500 mt-1">Switch between light and dark appearance.</p></div><button onclick="toggleTheme()" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Toggle</button></div><div class="flex gap-2 flex-wrap"><button onclick="demo()" class="px-4 py-2 rounded-xl bg-slate-100 font-semibold">Load demo data</button><button onclick="clearData()" class="px-4 py-2 rounded-xl bg-rose-50 text-rose-600 font-semibold">Clear all data</button></div></section></div><script>const s=state();currency.value=s.currency;currency.onchange=e=>{const x=state();x.currency=e.target.value;save(x)};function demo(){const x=state();const d=cloneDefault();x.transactions=d.transactions;x.budgets=d.budgets;x.goals=d.goals;save(x);location.reload()}function clearData(){if(confirm("Delete all transactions and goals?")){const x=state();x.transactions=[];x.goals=[];save(x);location.reload()}}</script></body></html>
