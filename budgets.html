<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SmartExpense — Budgets</title><script>if(localStorage.getItem('smartExpense_theme')==='dark')document.documentElement.classList.add('dark');</script><script>tailwind={config:{darkMode:'class'}};</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/theme.js"></script><style>body{background:#f6f8fb}html.dark body{background:#070b14;color:#e5e7eb}html.dark .bg-white{background:#0f172a!important}html.dark .bg-slate-50{background:#111827!important}.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8)}html.dark .glass{background:rgba(15,23,42,.94);border-color:#263449}</style></head><body class="min-h-screen"><main class="max-w-6xl mx-auto p-5 sm:p-8"><header class="flex items-center justify-between mb-8"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><h1 class="text-3xl font-black mt-5">Budgets</h1><p class="text-slate-500 mt-1">Set limits and stay on track.</p></div><button id="themeBtn" onclick="toggleTheme()" class="w-11 h-11 rounded-xl bg-white border border-slate-200">☼</button></header><div id="budgetGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></main><script src="./js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const s=JSON.parse(localStorage.getItem('smartExpense_v1')||'{}'),b=s.budgets||{},tx=s.transactions||[],c=s.currency||'₹';document.getElementById('budgetGrid').innerHTML=Object.entries(b).map(([cat,limit])=>{const spent=tx.filter(t=>t.type==='expense'&&t.category===cat).reduce((a,t)=>a+Number(t.amount||0),0),pct=Math.min(100,Math.round(spent/limit*100));return `<div class="glass rounded-3xl p-6"><div class="flex justify-between"><h2 class="font-bold">${cat}</h2><span class="text-sm text-slate-500">${pct}%</span></div><p class="text-2xl font-black mt-3">${c}${Math.round(spent).toLocaleString('en-IN')} <span class="text-sm font-normal text-slate-500">/ ${c}${Math.round(limit).toLocaleString('en-IN')}</span></p><div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 mt-4 overflow-hidden"><div class="h-full bg-indigo-500" style="width:${pct}%"></div></div></div>`}).join('');});</script></body></html>
