<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Budgets — SmartExpense</title><script>try{if(localStorage.getItem("smartExpense_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script><script src="https://cdn.tailwindcss.com"></script><script src="./js/shared.js"></script><style>body{background:#f6f8fb;color:#0f172a}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid #e2e8f0}html.dark,html.dark body{background:#070b14!important;color:#e5e7eb!important}html.dark .glass{background:#0f172a!important;border-color:#263449!important}</style></head><body><div class="max-w-[1900px] mx-auto min-h-screen px-4 sm:px-6 lg:px-10 py-5"><header class="flex items-center justify-between mb-7"><div><a href="index.html" class="font-black text-xl">SmartExpense</a><p class="text-xs text-slate-500">Monthly budgets</p></div><div class="flex gap-2"><button id="themeBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white border border-slate-200">☼</button><a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Dashboard</a></div></header><div class="flex justify-between items-center"><div><h1 class="text-3xl font-black">Budgets</h1><p class="text-sm text-slate-500 mt-1">Track this month's spending against your limits.</p></div><button onclick="setBudget()" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Set budget</button></div><div id="grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-6"></div></div><script>function render(){const s=state(),a=ex(s);grid.innerHTML=CATEGORIES.map(([cat,ic])=>{const spent=a.filter(t=>t.category===cat).reduce((n,t)=>n+Number(t.amount),0),limit=Number(s.budgets[cat]||0),p=limit?Math.min(100,spent/limit*100):0;return `<div class="glass rounded-3xl p-5"><div class="flex justify-between"><div class="flex gap-3 items-center"><span class="w-10 h-10 rounded-xl bg-slate-100 grid place-items-center">${ic}</span><div><p class="font-bold">${cat}</p><p class="text-xs text-slate-500">${money(spent,s)} spent</p></div></div><span class="text-xs font-bold">${Math.round(p)}%</span></div><div class="h-2 bg-slate-100 rounded-full mt-5 overflow-hidden"><div class="h-full bg-slate-900 rounded-full transition-all duration-700" style="width:${p}%"></div></div><p class="text-xs text-slate-500 mt-2">Budget: ${money(limit,s)}</p></div>`}).join("")}function setBudget(){const s=state(),cat=prompt("Category:","Food");if(!cat||!CATEGORIES.some(c=>c[0]===cat))return;const value=Number(prompt("Monthly budget:",s.budgets[cat]||5000));if(value>0){s.budgets[cat]=value;save(s);render()}}render();</script></body></html>
