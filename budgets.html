        }

  <script>

   tailwind = window.tailwind || {};

        tailwind.config = {

            darkMode: "class"

        };

  <style>

   /* SmartExpense shared theme compatibility */

html { color-scheme: light; }

html.dark { color-scheme: dark; }


html:not(.dark) body { color: #0f172a; }

html.dark body { color: #f8fafc; }


/* Make common slate text classes readable in both themes. */

html:not(.dark) .text-slate-800 { color: #1e293b !important; }

html:not(.dark) .text-slate-700 { color: #334155 !important; }

html:not(.dark) .text-slate-600 { color: #475569 !important; }

html:not(.dark) .text-slate-500 { color: #64748b !important; }

html:not(.dark) .text-slate-400 { color: #94a3b8 !important; }


html.dark .text-slate-800 { color: #e2e8f0 !important; }

html.dark .text-slate-700 { color: #e2e8f0 !important; }

html.dark .text-slate-600 { color: #cbd5e1 !important; }

html.dark .text-slate-500 { color: #94a3b8 !important; }

html.dark .text-slate-400 { color: #94a3b8 !important; }


html:not(.dark) input,

html:not(.dark) select,

html:not(.dark) textarea {

  color: #0f172a;

  background-color: #fff;

}

html.dark input,

html.dark select,

html.dark textarea {

  color: #f8fafc;

  background-color: #0f172a;

}

html:not(.dark) input::placeholder,

html:not(.dark) textarea::placeholder { color: #64748b; opacity: 1; }

html.dark input::placeholder,

html.dark textarea::placeholder { color: #94a3b8; opacity: 1; }
  </style>
  <style>

   body {

             background: radial-gradient(

                circle,

                rgba(238, 174, 202, 1) 0%,

                rgba(148, 187, 233, 1) 100%

            );

            min-height: 100vh;

        }


        .dark body {

            background:

                radial-gradient(circle at top left, rgba(79, 70, 229, 0.18), transparent 35%),

                radial-gradient(circle at bottom right, rgba(14, 116, 144, 0.15), transparent 35%),

                #020617;

        }


        .glass {

            background: rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            border: 1px solid rgba(255, 255, 255, 0.7);

            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);

        }


        .dark .glass {

            background: rgba(15, 23, 42, 0.78);

            border-color: rgba(148, 163, 184, 0.15);

            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);

        }
  </style>
</head> <body class="text-slate-800 dark:text-slate-100"> <main class="max-w-6xl mx-auto px-4 py-6 sm:px-6 lg:px-8">

<!-- Header --> <header class="flex items-center justify-between mb-8"> <div>

<h1 class="text-2xl sm:text-3xl font-bold"> Budgets </h1> <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">

Track your monthly spending limits </p> </div> <div class="flex items-center gap-2">

<button aria-label="Switch theme" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-center text-lg" id="themeBtn" onclick="toggleTheme()" type="button">

☾ </button>

<a class="px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-sm font-semibold" href="index.html">

Dashboard </a> </div> </header> <!-- Budget Cards -->

<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="budgetGrid"> </section> </main>

<!-- Shared application logic -->

  <script src="./js/app.js">
  </script>
  <script>

   document.addEventListener("DOMContentLoaded", function () {


            renderBudgets();



            window.addEventListener(

                "pageshow",

                renderBudgets

            );



            window.addEventListener(

                "storage",

                function (event) {


                    if (event.key === STORAGE_KEY) {

                        renderBudgets();

                    }


                }

            );


        });



        function renderBudgets() {


            const data = readState();


            const budgetGrid =

                document.getElementById("budgetGrid");



            const budgets =

                data.budgets || {};



            const transactions =

                ex(data);



            const categories =

                Object.entries(budgets);



            if (!categories.length) {


                budgetGrid.innerHTML = `

                    <div class="glass rounded-3xl p-8 text-center col-span-full">


                        <div class="text-5xl mb-4">

                            📊

                        </div>


                        <h2 class="text-xl font-bold">

                            No budgets available

                        </h2>


                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">

                            Add budget categories to start tracking your spending.

                        </p>


                    </div>

                `;


                return;

            }



            budgetGrid.innerHTML =

                categories.map(function ([category, limit]) {


                    const budgetLimit =

                        Number(limit) || 0;



                    const spent =

                        transactions

                            .filter(function (transaction) {


                                return transaction.category === category;


                            })

                            .reduce(function (sum, transaction) {


                                return sum +

                                    Number(transaction.amount || 0);


                            }, 0);



                    const percentage =

                        budgetLimit > 0

                            ? Math.round(

                                (spent / budgetLimit) * 100

                            )

                            : 0;



                    const safePercentage =

                        Math.min(

                            100,

                            Math.max(0, percentage)

                        );



                    let statusText =

                        "Within budget";


                    let statusClass =

                        "text-emerald-600 dark:text-emerald-400";



                    if (budgetLimit === 0) {


                        statusText =

                            "No budget set";


                        statusClass =

                            "text-slate-500 dark:text-slate-400";


                    } else if (spent > budgetLimit) {


                        statusText =
                            "Budget exceeded";

                        statusClass =
                            "text-rose-600 dark:text-rose-400";

                    } else if (percentage >= 80) {

                        statusText =
                            "Near budget limit";

                        statusClass =
                            "text-amber-600 dark:text-amber-400";

                    }


                    return `
                        <div class="glass rounded-3xl p-5">

                            <div class="flex items-center justify-between mb-5">

                                <div class="flex items-center gap-3">

                                    <div class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xl">
                                        ${icon(category)}
                                    </div>

                                    <div>

                                        <h2 class="font-bold">
                                            ${esc(category)}
                                        </h2>

                                        <p class="text-xs text-slate-500 dark:text-slate-400">
                                            Monthly budget
                                        </p>

                                    </div>

                                </div>

                                <span class="text-sm font-bold">
                                    ${safePercentage}%
                                </span>

                            </div>


                            <div class="mb-3">

                                <div class="flex justify-between text-sm mb-2">

                                    <span class="text-slate-500 dark:text-slate-400">
                                        Spent
                                    </span>

                                    <span class="font-semibold">
                                        ${money(spent, data.currency)}
                                    </span>

                                </div>


                                <div class="flex justify-between text-sm">

                                    <span class="text-slate-500 dark:text-slate-400">
                                        Limit
                                    </span>

                                    <span class="font-semibold">
                                        ${money(budgetLimit, data.currency)}
                                    </span>

                                </div>

                            </div>


                            <div class="w-full h-3 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">

                                <div
                                    class="h-full rounded-full bg-indigo-600"
                                    style="width: ${safePercentage}%">
                                </div>

                            </div>


                            <div class="mt-4">

                                <p class="text-sm font-semibold ${statusClass}">
                                    ${statusText}
                                </p>

                            </div>

                        </div>
                    `;

                }).join("");

        }
  </script>
</body> </html>
